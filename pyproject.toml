[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-scratchpad-synthesizer"
version = "2.0.0"
description = "ScratchpadMind: Structured Working Memory & Chain-of-Thought Verifier Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
engine-scratchpad-synthesizer = "scratchpad_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/engine-scratchpad-synthesizer"
Repository = "https://github.com/abusuraihsakhri/engine-scratchpad-synthesizer.git"
